name: Refresh Saptarshi profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch real GitHub contribution data
        env:
          GH_PROFILE_USER: Sap1x
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Render animated stats card
        run: python scripts/render_stats_svg.py

      - name: Commit refreshed profile art
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: refresh Saptarshi GitHub profile art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg"
